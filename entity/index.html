<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국어 신어 지식그래프</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f8f9fb; }
    body { font-family: 'Noto Sans KR', 'Pretendard', sans-serif; display: flex; flex-direction: column; }

    /* ── 헤더 바 ── */
    #header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1.2rem;
      height: 46px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      z-index: 10;
    }
    #header .logo {
      font-family: 'Noto Sans KR', 'Pretendard', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #1e3a8a;
      text-decoration: none;
      flex-shrink: 0;
    }
    .graph-tabs { display: flex; gap: 8px; flex-shrink: 0; }
    a.graph-tab { text-decoration: none; display: inline-flex; align-items: center; }
    .graph-tab {
      font-family: 'Noto Sans KR', 'Pretendard', sans-serif;
      font-size: 0.8rem; font-weight: 500;
      padding: 0.3rem 0.8rem; border: 1px solid #e2e8f0;
      border-radius: 4px; background: transparent; color: #64748b;
      cursor: pointer; transition: all 0.15s;
    }
    .graph-tab:hover { color: #1e3a8a; border-color: #93c5fd; }
    .graph-tab.is-active { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
    .beta-badge {
      display: inline-block; margin-left: 6px; padding: 1px 5px;
      font-size: 0.58rem; font-weight: 700; letter-spacing: 0.04em;
      border-radius: 3px; background: #fef3c7; color: #92400e;
      vertical-align: 1px;
    }
    .graph-tab.is-active .beta-badge { background: rgba(255,255,255,0.2); color: #fde68a; }
    #header .stats {
      font-size: 0.75rem;
      color: #64748b;
      font-family: 'Noto Sans KR', 'Pretendard', sans-serif;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    #header .stats span { color: #1e3a8a; font-weight: 700; }
    #searchWrap {
      flex: 1;
      max-width: 320px;
      position: relative;
    }
    #graphSearch {
      width: 100%;
      padding: 0.35rem 0.9rem;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: 'Noto Sans KR', 'Pretendard', sans-serif;
      background: #f8f9fb;
      color: #1e293b;
      outline: none;
      transition: border-color 0.15s;
    }
    #graphSearch:focus { border-color: #1e3a8a; background: #fff; }
    #graphSearch::placeholder { color: #94a3b8; }
    .header-links { display: flex; gap: 0.7rem; flex-shrink: 0; margin-left: auto; }
    .header-links a {
      font-size: 0.78rem;
      color: #475569;
      text-decoration: none;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      transition: color 0.15s, border-color 0.15s;
    }
    .header-links a:hover { color: #1e3a8a; border-color: #1e3a8a; }

    /* ── 캔버스 영역 ── */
    #graph-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #graph-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #graph-canvas:active { cursor: grabbing; }

    /* ── 툴팁 ── */
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(255,255,255,0.97);
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.45rem 0.7rem;
      font-size: 0.82rem;
      color: #1e293b;
      pointer-events: none;
      max-width: 220px;
      box-shadow: 0 2px 8px rgba(30,58,138,0.10);
      z-index: 20;
      line-height: 1.5;
    }
    #tooltip.tt-pinned { pointer-events: auto; }
    #tooltip .tt-label { font-weight: 700; color: #1e3a8a; }
    #tooltip .tt-meta { color: #64748b; font-size: 0.75rem; }
    #tooltip .tt-link {
      display: inline-block;
      margin-top: 0.3rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: #1e3a8a;
      text-decoration: none;
      cursor: pointer;
    }
    #tooltip .tt-link:hover { text-decoration: underline; }

    /* ── 층 토글 ── */
    #layer-toggles {
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-size: 0.75rem;
      color: #475569;
      line-height: 1.7;
    }
    #layer-toggles .lt-title { font-weight: 700; color: #334155; margin-bottom: 0.2rem; font-size: 0.72rem; }
    #layer-toggles .lt-row {
      display: flex; align-items: center; gap: 0.4rem;
      cursor: pointer; user-select: none;
    }
    #layer-toggles .lt-row input { margin: 0; accent-color: #475569; }
    #layer-toggles .lt-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    #layer-toggles .lt-fixed { opacity: 0.7; cursor: default; background: #f1f5f9; border-radius: 3px; padding: 0 0.3rem; }
    #layer-toggles .lt-hint { font-size: 0.67rem; color: #94a3b8; margin-top: 0.2rem; }
    #hop-control {
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-size: 0.75rem;
      color: #475569;
      line-height: 1.7;
    }
    #hop-control .lt-title { font-weight: 700; color: #334155; margin-bottom: 0.2rem; font-size: 0.72rem; }
    #hop-control .lt-row {
      display: flex; align-items: center; gap: 0.4rem;
      cursor: pointer; user-select: none;
    }
    #hop-control .lt-row input { margin: 0; accent-color: #475569; }
    #hop-control .lt-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    #ll-control .facet-list { max-height: 320px; }
    #ll-control #ll-stats {
      font-size: 0.67rem; color: #94a3b8;
      padding: 0.25rem 0.5rem 0.1rem; margin-top: 0.2rem;
      border-top: 1px solid #e2e8f0;
    }
    /* ── 왼쪽 상단 컨트롤 래퍼 ── */
    #graph-controls-left {
      position: absolute;
      top: 0.6rem;
      left: 1rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    /* ── 필터 (엑셀식 체크리스트) ── */
    .facet {
      position: relative;
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #475569;
      width: 172px;
    }
    .facet-head {
      display: flex; align-items: center; gap: 0.35rem;
      width: 100%; padding: 0.4rem 0.7rem;
      background: transparent; border: none; cursor: pointer;
      font-family: 'Noto Sans KR', 'Pretendard', sans-serif;
      font-size: 0.72rem; font-weight: 700; color: #334155;
    }
    .facet-head .facet-sum {
      margin-left: auto; font-weight: 500; color: #64748b;
      max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .facet-head .facet-sum.filtered { color: #1e3a8a; font-weight: 700; }
    .facet-head .facet-arrow { font-size: 0.6rem; color: #94a3b8; }
    .facet-list {
      display: none;
      position: absolute; top: 100%; left: 0; margin-top: 2px;
      min-width: 100%; z-index: 30;
      background: #fff; border: 1px solid #cbd5e1; border-radius: 6px;
      box-shadow: 0 4px 12px rgba(15,23,42,0.12);
      padding: 0.3rem 0.2rem;
      max-height: 260px; overflow-y: auto;
    }
    .facet.open .facet-list { display: block; }
    .facet-list label {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.12rem 0.5rem; cursor: pointer; user-select: none;
      white-space: nowrap; color: #334155;
    }
    .facet-list label:hover { background: #f1f5f9; }
    .facet-list input { margin: 0; accent-color: #1e3a8a; }
    .facet-list .facet-all { border-bottom: 1px solid #e2e8f0; margin-bottom: 0.2rem; padding-bottom: 0.25rem; font-weight: 700; }
    .facet-list .fc-n { color: #94a3b8; font-size: 0.68rem; margin-left: auto; padding-left: 0.5rem; }

    /* ── 범례 ── */
    #legend {
      position: absolute;
      bottom: 2.8rem;
      left: 1rem;
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-size: 0.75rem;
      color: #475569;
      z-index: 10;
      line-height: 1.7;
      width: 172px;
      box-sizing: border-box;
    }
    #legend .leg-row { display: flex; align-items: center; gap: 0.5rem; }
    #legend .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── 격리 안내 ── */
    #isolated-note {
      position: absolute;
      top: 0.6rem;
      right: 1rem;
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      font-size: 0.72rem;
      color: #94a3b8;
      z-index: 10;
    }
    #isolated-note a { color: #475569; }
    #isolated-note a:hover { color: #1e3a8a; }

    /* ── 로딩 ── */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8f9fb;
      z-index: 30;
      color: #64748b;
      font-size: 0.88rem;
      gap: 0.7rem;
    }
    #loading .spin {
      width: 28px; height: 28px;
      border: 3px solid #e2e8f0;
      border-top-color: #1e3a8a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 정보 패널 ── */
    #info-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 470px;
      height: 100%;
      background: #ffffff;
      border-left: 1px solid #e2e8f0;
      z-index: 15;
      display: none;
      flex-direction: column;
      font-size: 0.82rem;
      box-shadow: -4px 0 16px rgba(30,58,138,0.08);
    }
    #info-panel.open { display: flex; }
    #info-panel .ip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1.2rem;
      border-bottom: 2px solid #e2e8f0;
      background: #f8fafc;
    }
    #info-panel .ip-title {
      font-weight: 800;
      color: #1e3a8a;
      font-size: 1rem;
    }
    #info-panel .ip-close {
      border: none;
      background: transparent;
      font-size: 1.2rem;
      color: #94a3b8;
      cursor: pointer;
      padding: 0.3rem;
    }
    #info-panel .ip-close:hover { color: #475569; }
    #info-panel .ip-type {
      font-size: 0.72rem;
      color: #64748b;
      padding: 0.4rem 1.2rem 0.5rem;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    #info-panel .ip-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }
    #info-panel .ip-section {
      font-size: 0.72rem;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin: 0;
      padding: 0.5rem 1.2rem;
      background: #f1f5f9;
      border-bottom: 1px solid #e2e8f0;
    }
    #info-panel .ip-item {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.3rem 0.5rem;
      padding: 0.45rem 1.2rem;
      color: #1e293b;
      text-decoration: none;
      font-size: 0.82rem;
      border-bottom: 1px solid #f1f5f9;
    }
    #info-panel .ip-item:hover { background: #f8fafc; color: #1e3a8a; }
    #info-panel .ip-item-sub {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-left: auto;
      white-space: nowrap;
    }
    #info-panel .ip-via { font-size: 0.62rem; }

    /* ── KB 버튼 ── */
    .kb-btns { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; width: 100%; }
    .kb-btn {
      font-size: 0.62rem; padding: 1px 6px; border-radius: 3px;
      text-decoration: none; border: 1px solid; white-space: nowrap;
      line-height: 1.5;
    }
    .kb-btn-on { background: #f0fdf4; border-color: #86efac; color: #059669; }
    .kb-btn-on:hover { background: #dcfce7; }
    .kb-btn-off { background: #f8fafc; border-color: #e2e8f0; color: #cbd5e1; pointer-events: none; }

    /* ── 하단 바 ── */
    #bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.97);
      border-top: 1px solid #cbd5e1;
      z-index: 10; display: flex; flex-direction: column;
    }
    #bottom-bar .bb-header {
      display: flex; justify-content: center; align-items: center; gap: 0.5rem;
      padding: 0.3rem 1rem; cursor: pointer; user-select: none;
      font-size: 0.72rem; font-weight: 700; color: #334155;
    }
    #bottom-bar .bb-toggle { font-size: 0.7rem; color: #94a3b8; }
    #bottom-bar .bb-body { overflow-y: auto; max-height: 32vh; padding: 0.3rem 1rem 0.5rem; }
    #bottom-bar.collapsed .bb-body { display: none; }
    #bottom-bar .bb-tabs { display: flex; gap: 0.3rem; margin-bottom: 0.4rem; }
    #bottom-bar .bb-tab {
      font-size: 0.7rem; padding: 0.25rem 0.6rem; border-radius: 4px;
      background: #f1f5f9; color: #64748b; cursor: pointer; border: none;
      font-family: inherit;
    }
    #bottom-bar .bb-tab.active { background: #1e3a8a; color: #fff; }
    #bottom-bar .bb-list { display: flex; flex-wrap: wrap; gap: 0.15rem 0.4rem; }
    #bottom-bar .bb-item {
      font-size: 0.72rem; color: #334155; cursor: pointer;
      padding: 0.15rem 0.4rem; border-radius: 3px; white-space: nowrap;
    }
    #bottom-bar .bb-item:hover { background: #e0e7ff; color: #1e3a8a; }
    #bottom-bar .bb-deg { font-size: 0.6rem; color: #94a3b8; margin-left: 2px; }
  </style>

  <!-- graph-mobile --><link rel="stylesheet" href="../assets/graph-mobile.css?v=0ea1914f"><!-- /graph-mobile -->
</head>
<body>

  <!-- 헤더 바 -->
  <div id="header">
    <a class="logo" href="../index.html">한국어 신어 지식 그래프</a>
    <div class="graph-tabs">
      <button class="graph-tab is-active" id="tab-main">개체명 공동 출현 그래프</button>
      <a class="graph-tab" href="../index.html">스키마-사례 그래프</a>
      <button class="graph-tab" id="tab-morph" style="display:none;">구성 성분 그래프</button>
      <button class="graph-tab" id="tab-verb">감정 용언 공기 그래프<span class="beta-badge">BETA</span></button>
    </div>
    <div class="stats" id="stats-text">신어 <span>2,474</span></div>
    <div id="searchWrap">
      <input type="text" id="graphSearch" placeholder="신어·개체명 검색…" autocomplete="off">
    </div>
    <div class="header-links">
      <a href="https://korneo.github.io/KNO/" target="_blank" rel="noopener">한국어 신어 관측 시스템</a>
    </div>
  </div>

  <!-- 그래프 캔버스 -->
  <div id="graph-container">
    <canvas id="graph-canvas"></canvas>

    <div id="tooltip">
      <div class="tt-label" id="tt-label"></div>
      <div class="tt-meta" id="tt-meta"></div>
      <a class="tt-link" id="tt-link" style="display:none;"></a>
    </div>

    <div id="isolated-note" style="display:none;">
      구성 성분 미공유 신어 473개 &mdash;
      <a href="list.html?filter=고립">목록에서 보기</a>
    </div>

    <div id="graph-controls-left">
      <div class="facet" data-key="year">
        <button class="facet-head">수집 연도 <span class="facet-sum">전체</span> <span class="facet-arrow">▾</span></button>
        <div class="facet-list">
          <label class="facet-all"><input type="checkbox" checked> (모두 선택)</label>
          <label><input type="checkbox" value="2020" checked> 2020 <span class="fc-n">404</span></label>
          <label><input type="checkbox" value="2021" checked> 2021 <span class="fc-n">296</span></label>
          <label><input type="checkbox" value="2022" checked> 2022 <span class="fc-n">307</span></label>
          <label><input type="checkbox" value="2023" checked> 2023 <span class="fc-n">362</span></label>
          <label><input type="checkbox" value="2024" checked> 2024 <span class="fc-n">401</span></label>
          <label><input type="checkbox" value="2025" checked> 2025 <span class="fc-n">704</span></label>
        </div>
      </div>
      <div class="facet" data-key="ut">
        <button class="facet-head">단어/구 <span class="facet-sum">전체</span> <span class="facet-arrow">▾</span></button>
        <div class="facet-list">
          <label class="facet-all"><input type="checkbox" checked> (모두 선택)</label>
          <label><input type="checkbox" value="단어" checked> 단어 <span class="fc-n">1,024</span></label>
          <label><input type="checkbox" value="구" checked> 구 <span class="fc-n">1,450</span></label>
        </div>
      </div>
      <div class="facet" data-key="fm">
        <button class="facet-head">조어법 <span class="facet-sum">전체</span> <span class="facet-arrow">▾</span></button>
        <div class="facet-list">
          <label class="facet-all"><input type="checkbox" checked> (모두 선택)</label>
          <label><input type="checkbox" value="합성" checked> 합성 <span class="fc-n">172</span></label>
          <label><input type="checkbox" value="파생" checked> 파생 <span class="fc-n">161</span></label>
          <label><input type="checkbox" value="혼성" checked> 혼성 <span class="fc-n">321</span></label>
          <label><input type="checkbox" value="축약" checked> 축약 <span class="fc-n">270</span></label>
          <label><input type="checkbox" value="차용" checked> 차용 <span class="fc-n">88</span></label>
          <label><input type="checkbox" value="기타" checked> 기타 <span class="fc-n">12</span></label>
        </div>
      </div>
      <div class="facet" data-key="cat">
        <button class="facet-head">의미 범주 <span class="facet-sum">전체</span> <span class="facet-arrow">▾</span></button>
        <div class="facet-list">
          <label class="facet-all"><input type="checkbox" checked> (모두 선택)</label>
          <label><input type="checkbox" value="정치와 행정" checked> 정치와 행정 <span class="fc-n">620</span></label>
          <label><input type="checkbox" value="경제생활" checked> 경제생활 <span class="fc-n">428</span></label>
          <label><input type="checkbox" value="사회생활" checked> 사회생활 <span class="fc-n">324</span></label>
          <label><input type="checkbox" value="인간" checked> 인간 <span class="fc-n">295</span></label>
          <label><input type="checkbox" value="삶" checked> 삶 <span class="fc-n">183</span></label>
          <label><input type="checkbox" value="보건·의학" checked> 보건·의학 <span class="fc-n">153</span></label>
          <label><input type="checkbox" value="식생활" checked> 식생활 <span class="fc-n">92</span></label>
          <label><input type="checkbox" value="문화" checked> 문화 <span class="fc-n">87</span></label>
          <label><input type="checkbox" value="의생활" checked> 의생활 <span class="fc-n">72</span></label>
          <label><input type="checkbox" value="교육" checked> 교육 <span class="fc-n">57</span></label>
          <label><input type="checkbox" value="정보·기술" checked> 정보·기술 <span class="fc-n">54</span></label>
          <label><input type="checkbox" value="주생활" checked> 주생활 <span class="fc-n">48</span></label>
