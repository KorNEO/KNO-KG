<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>형태소 그래프 — 한국어 신어 관측 시스템</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f8f9fb; }
    body { font-family: 'Noto Sans KR', 'Pretendard', sans-serif; display: flex; flex-direction: column; }

    /* ── 헤더 바 ── */
    #header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1.2rem;
      height: 46px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      z-index: 10;
    }
    #header .logo {
      font-family: 'Noto Sans KR', 'Pretendard', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #1e3a8a;
      text-decoration: none;
      flex-shrink: 0;
    }
    #header .stats {
      font-size: 0.75rem;
      color: #64748b;
      font-family: 'Noto Sans KR', 'Pretendard', sans-serif;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    #header .stats span { color: #1e3a8a; font-weight: 700; }
    #searchWrap {
      flex: 1;
      max-width: 320px;
      position: relative;
    }
    #graphSearch {
      width: 100%;
      padding: 0.35rem 0.9rem;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: 'Noto Sans KR', 'Pretendard', sans-serif;
      background: #f8f9fb;
      color: #1e293b;
      outline: none;
      transition: border-color 0.15s;
    }
    #graphSearch:focus { border-color: #1e3a8a; background: #fff; }
    #graphSearch::placeholder { color: #94a3b8; }
    .header-links { display: flex; gap: 0.7rem; flex-shrink: 0; }
    .header-links a {
      font-size: 0.78rem;
      color: #475569;
      text-decoration: none;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      transition: color 0.15s, border-color 0.15s;
    }
    .header-links a:hover { color: #1e3a8a; border-color: #1e3a8a; }

    /* ── 캔버스 영역 ── */
    #graph-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #graph-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #graph-canvas:active { cursor: grabbing; }

    /* ── 툴팁 ── */
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(255,255,255,0.97);
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.45rem 0.7rem;
      font-size: 0.82rem;
      color: #1e293b;
      pointer-events: none;
      max-width: 220px;
      box-shadow: 0 2px 8px rgba(30,58,138,0.10);
      z-index: 20;
      line-height: 1.5;
    }
    #tooltip .tt-label { font-weight: 700; color: #1e3a8a; }
    #tooltip .tt-meta { color: #64748b; font-size: 0.75rem; }

    /* ── 층 토글 ── */
    #layer-toggles {
      position: absolute;
      top: 0.6rem;
      left: 1rem;
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-size: 0.75rem;
      color: #475569;
      z-index: 10;
      line-height: 1.7;
    }
    #layer-toggles .lt-title { font-weight: 700; color: #334155; margin-bottom: 0.2rem; font-size: 0.72rem; }
    #layer-toggles .lt-row {
      display: flex; align-items: center; gap: 0.4rem;
      cursor: pointer; user-select: none;
    }
    #layer-toggles .lt-row input { margin: 0; accent-color: #475569; }
    #layer-toggles .lt-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    #layer-toggles .lt-hint { font-size: 0.67rem; color: #94a3b8; margin-top: 0.2rem; }

    /* ── 범례 ── */
    #legend {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      font-size: 0.75rem;
      color: #475569;
      z-index: 10;
      line-height: 1.8;
    }
    #legend .leg-row { display: flex; align-items: center; gap: 0.5rem; }
    #legend .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ── 연도 범례 ── */
    #year-legend {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      font-size: 0.75rem;
      color: #475569;
      z-index: 10;
    }
    #year-legend .yl-title { font-weight: 700; color: #475569; margin-bottom: 0.3rem; font-size: 0.72rem; }
    #year-legend .yl-gradient {
      width: 120px; height: 8px; border-radius: 4px;
      background: linear-gradient(to right, #cbd5e1, #1e3a8a);
      margin: 0.2rem 0;
    }
    #year-legend .yl-labels { display: flex; justify-content: space-between; font-size: 0.68rem; color: #94a3b8; }

    /* ── 격리 안내 ── */
    #isolated-note {
      position: absolute;
      top: 0.6rem;
      right: 1rem;
      background: rgba(255,255,255,0.95);
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      font-size: 0.72rem;
      color: #94a3b8;
      z-index: 10;
    }
    #isolated-note a { color: #475569; }
    #isolated-note a:hover { color: #1e3a8a; }

    /* ── 로딩 ── */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8f9fb;
      z-index: 30;
      color: #64748b;
      font-size: 0.88rem;
      gap: 0.7rem;
    }
    #loading .spin {
      width: 28px; height: 28px;
      border: 3px solid #e2e8f0;
      border-top-color: #1e3a8a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- 헤더 바 -->
  <div id="header">
    <a class="logo" href="index.html">한국어 신어 관측 시스템 — 지식그래프</a>
    <div class="stats">
      표제어 <span>1,489</span> &middot; 구성 요소 <span>638</span>
    </div>
    <div id="searchWrap">
      <input type="text" id="graphSearch" placeholder="표제어 검색…" autocomplete="off">
    </div>
    <div class="header-links">
      <a href="index.html">전체 그래프</a>
      <a href="list.html">목록</a>
      <a href="https://github.com/KorNEO/KNO" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>

  <!-- 그래프 캔버스 -->
  <div id="graph-container">
    <canvas id="graph-canvas"></canvas>

    <div id="tooltip">
      <div class="tt-label" id="tt-label"></div>
      <div class="tt-meta" id="tt-meta"></div>
    </div>

    <div id="isolated-note">구성 요소 미공유 표제어 985개 &mdash; <a href="list.html?filter=고립">목록에서 보기</a></div>

    <div id="year-legend">
      <div class="yl-title">표제어 수집 연도</div>
      <div class="yl-gradient"></div>
      <div class="yl-labels"><span>2020</span><span>2025</span></div>
    </div>



    <div id="legend">
      <div class="leg-row">
        <div class="leg-dot" style="background:#334155;"></div>
        <span>표제어</span>
      </div>
      <div class="leg-row">
        <div class="leg-dot" style="background:#2563eb; width:14px; height:14px;"></div>
        <span>구성 요소</span>
      </div>
    </div>

    <div id="loading">
      <div class="spin"></div>
      그래프 시뮬레이션 중…
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    // ── 설정 상수 ─────────────────────────────────────────────────────────────
    var HUB_LABEL_DEGREE = 15;      // 영구 레이블 표시 최소 degree
    var ZOOM_LABEL_THRESHOLD = 2.5; // 이 줌 이상이면 모든 노드 레이블
    var SIM_ALPHA_STOP = 0.005;     // 시뮬레이션 종료 임계값
    var YEAR_MIN = 2020, YEAR_MAX = 2025;

    // ── 층별 색상 (저채도 팔레트) ───────────────────────────────────────────
    var LAYER_COLORS = {
      element:   '#94a3b8',  // slate
      corpus:    '#9aa5b1',  // muted steel
      kb:        '#c49a5a',  // muted amber
      entity:    '#b07a8c',  // muted rose
    };
    var LAYER_ALPHA = {
      element: 0.18, corpus: 0.10, kb: 0.28, entity: 0.32
    };

    // ── 이 페이지가 표시하는 층 & 토글 상태 ─────────────────────────────────
    var PAGE_LAYERS = ['element'];
    var layerActive = {};
    PAGE_LAYERS.forEach(function(l) { layerActive[l] = true; });

    // ── 컬러 팔레트 ──────────────────────────────────────────────────────────
    // 연도별 entry 색상: 2020 밝은 slate → 2025 짙은 navy
    var yearColorScale = d3.scaleSequential()
      .domain([YEAR_MIN, YEAR_MAX])
      .interpolator(d3.interpolate('#cbd5e1', '#1e3a8a'));

    function entryColor(d) {
      if (d.year) return yearColorScale(Math.min(Math.max(d.year, YEAR_MIN), YEAR_MAX));
      return '#475569';
    }

    // element 색상: 연결 수에 따라 accent blue
    var elemColorScale = d3.scaleSequential()
      .domain([2, 45])
      .interpolator(d3.interpolate('#93c5fd', '#1d4ed8'));

    function elementColor(d) {
      return elemColorScale(Math.min(d.degree || 2, 45));
    }

    // hub 노드(category/formation/kb) 색상
    var HUB_COLORS = {
      corpus: '#64748b',
      kb:     '#b07a3a',
    };

    // ── 캔버스 & 크기 ─────────────────────────────────────────────────────────
    var container = document.getElementById('graph-container');
    var canvas = document.getElementById('graph-canvas');
    var ctx = canvas.getContext('2d');
    var W, H, dpr;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      W = container.clientWidth;
      H = container.clientHeight;
      canvas.width  = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width  = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }
    window.addEventListener('resize', resize);

    // ── 트랜스폼 (pan/zoom) ────────────────────────────────────────────────────
    var transform = d3.zoomIdentity;
    var zoom = d3.zoom()
      .scaleExtent([0.05, 12])
      .on('zoom', function(event) {
        transform = event.transform;
        draw();
      });
    d3.select(canvas).call(zoom);

    // ── 그래프 데이터 로드 ──────────────────────────────────────────────────────
    var allNodes = [], allLinks = [];
    var nodes = [], links = [], nodeMap = {};
    var simRunning = false;
    var simulation;

    // 활성 층 기준 표시할 노드/링크 계산
    function computeVisible() {
      // 활성 층의 링크만
      var visLinks = allLinks.filter(function(l) {
        return layerActive[l.layer];
      });
      // 활성 링크에 연결된 노드 집합 (entry는 어떤 층에서든 연결되면 표시)
      var visNodeIds = new Set();
      visLinks.forEach(function(l) {
        visNodeIds.add(typeof l.source === 'object' ? l.source.id : l.source);
        visNodeIds.add(typeof l.target === 'object' ? l.target.id : l.target);
      });
      // 층 전용 노드: 해당 층 비활성이면 제거
      var visNodes = allNodes.filter(function(n) {
        if (n.type === 'corpus') return layerActive.corpus && visNodeIds.has(n.id);
        if (n.type === 'kb') return layerActive.kb && visNodeIds.has(n.id);
        if (n.type === 'entity') return layerActive.entity && visNodeIds.has(n.id);
        if (n.type === 'element') return layerActive.element && visNodeIds.has(n.id);
        if (n.type === 'category' || n.type === 'formation') return false;
        // entry: 형태소 그래프에선 구성 요소 연결분만, 전체 그래프에선 전부
        if (layerActive.element !== undefined) return visNodeIds.has(n.id);
        return true;
      });
      return { nodes: visNodes, links: visLinks };
    }

    // alpha: 시작 알파값. 초기 로드는 기본값(1), 층 토글 재시작은 0.4 사용.
    function startSimulation(simNodes, simLinks, alpha) {
      // 링크 소스/타겟을 노드 객체로 교체 (문자열 ID → 객체)
      var nm = {};
      simNodes.forEach(function(n) { nm[n.id] = n; });
      simLinks.forEach(function(l) {
        l.source = nm[l.source] || (typeof l.source === 'object' ? l.source : l.source);
        l.target = nm[l.target] || (typeof l.target === 'object' ? l.target : l.target);
      });
      nodeMap = nm;
      nodes = simNodes;
      links = simLinks;

      if (simulation) simulation.stop();
      simulation = d3.forceSimulation(nodes)
        .alpha(alpha !== undefined ? alpha : 1)
        .alphaDecay(0.015)
        .velocityDecay(0.4)
        .force('link', d3.forceLink(links)
          .id(function(d) { return d.id; })
          .distance(function(l) {
            var t = l.target;
            var tp = typeof t === 'object' ? t.type : '';
            if (tp === 'corpus') return 140;
            if (tp === 'kb') return 80;
            if (tp === 'entity') return 40;
            var deg = (typeof t === 'object' ? t.degree : 1) || 1;
            return 18 + deg * 1.2;
          })
          .strength(function(l) {
            var t = l.target;
            var tp = typeof t === 'object' ? t.type : '';
            if (tp === 'corpus') return 0.03;
            if (tp === 'kb') return 0.2;
            if (tp === 'entity') return 0.4;
            return 0.6;
          }))
        .force('charge', d3.forceManyBody()
          .strength(function(d) {
            if (d.type === 'element') return -80 - (d.degree || 1) * 3;
            if (d.type === 'corpus') return -800;
            if (d.type === 'kb') return -300;
            if (d.type === 'entity') return -60 - (d.degree || 1) * 3;
            return -30;
          })
          .theta(0.9)
          .distanceMax(400))
        .force('center', d3.forceCenter(0, 0).strength(0.05))
        .force('collision', d3.forceCollide()
          .radius(function(d) { return nodeRadius(d) + 2; })
          .strength(0.5))
        .on('tick', function() {
          var lo = document.getElementById('loading');
          if (lo.style.display !== 'none') lo.style.display = 'none';
          if (simulation.alpha() < SIM_ALPHA_STOP) {
            simRunning = false;
            simulation.stop();
          }
          draw();
        })
        .on('end', function() {
          simRunning = false;
          document.getElementById('loading').style.display = 'none';
          draw();
        });
      simRunning = true;
    }

    fetch('graph-data.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        // entry 고립 노드도 allNodes에 포함 (category 층이 켜지면 연결될 수 있음)
        allNodes = data.nodes;
        allLinks = data.links;

        var vis = computeVisible();
        startSimulation(vis.nodes, vis.links);

        // 초기 뷰 중앙 맞춤
        transform = d3.zoomIdentity.translate(W / 2, H / 2).scale(0.8);
        d3.select(canvas).call(zoom.transform, transform);
        document.getElementById('loading').style.display = 'flex';
      })
      .catch(function(err) {
        document.getElementById('loading').textContent = '데이터 로드 실패: ' + err.message;
      });

    // ── 층 토글 이벤트 ────────────────────────────────────────────────────────
    PAGE_LAYERS.forEach(function(layer) {
      var cb = document.getElementById('tog-' + layer);
      if (!cb) return;
      cb.addEventListener('change', function() {
        layerActive[layer] = cb.checked;
        if (!allNodes.length) return;
        var vis = computeVisible();
        // 포지션 유지: 이미 계산된 x/y는 새 node 배열에서도 살아 있음
        // alpha=0.4 로 재시작 — startSimulation 안에서 단일 처리
        startSimulation(vis.nodes, vis.links, 0.4);
        document.getElementById('loading').style.display = 'flex';
      });
    });

    // ── 노드 반지름 ───────────────────────────────────────────────────────────
    function nodeRadius(d) {
      if (d.type === 'element') {
        return 3 + Math.sqrt(d.degree || 1) * 2.2;
      }
      if (d.type === 'corpus') return 14;
      if (d.type === 'kb') return 12;
      if (d.type === 'entity') return 3.5 + Math.sqrt(d.degree || 1) * 2;
      return 4;
    }

    // ── 드로 함수 (canvas 2D) ─────────────────────────────────────────────────
    function draw() {
      ctx.clearRect(0, 0, W, H);

      // 배경
      ctx.fillStyle = '#f8f9fb';
      ctx.fillRect(0, 0, W, H);

      if (!nodes.length) return;

      ctx.save();
      ctx.translate(transform.x, transform.y);
      ctx.scale(transform.k, transform.k);

      var k = transform.k;

      // ── 링크 (층별 색상) ───────────────────────────────────────────────────
      var layerGroups = {};
      for (var i = 0; i < links.length; i++) {
        var l = links[i];
        var lay = l.layer || 'element';
        if (!layerGroups[lay]) layerGroups[lay] = [];
        layerGroups[lay].push(l);
      }
      var layerOrder = PAGE_LAYERS;
      for (var li = 0; li < layerOrder.length; li++) {
        var lay = layerOrder[li];
        var grp = layerGroups[lay];
        if (!grp) continue;
        ctx.globalAlpha = LAYER_ALPHA[lay] || 0.18;
        ctx.strokeStyle = LAYER_COLORS[lay] || '#94a3b8';
        if (lay === 'entity') {
          // 개체명 엣지: 굵기 = 함께 나온 기사 수
          for (var gi = 0; gi < grp.length; gi++) {
            var gl = grp[gi];
            var sx = gl.source.x, sy = gl.source.y;
            var tx = gl.target.x, ty = gl.target.y;
            if (sx == null || sy == null || tx == null || ty == null) continue;
            ctx.lineWidth = (0.8 + Math.min((gl.w || 1) - 1, 6) * 0.5) / k;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(tx, ty);
            ctx.stroke();
          }
          continue;
        }
        ctx.lineWidth = (lay === 'element' ? 1 : 1.2) / k;
        ctx.beginPath();
        for (var gi = 0; gi < grp.length; gi++) {
          var gl = grp[gi];
          var sx = gl.source.x, sy = gl.source.y;
          var tx = gl.target.x, ty = gl.target.y;
          if (sx == null || sy == null || tx == null || ty == null) continue;
          ctx.moveTo(sx, sy);
          ctx.lineTo(tx, ty);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // ── 노드 ────────────────────────────────────────────────────────────────
      for (var j = 0; j < nodes.length; j++) {
        var n = nodes[j];
        if (n.x == null || n.y == null) continue;
        var r = nodeRadius(n);

        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);

        if (n.type === 'element') {
          ctx.fillStyle = elementColor(n);
          ctx.fill();
          ctx.strokeStyle = 'rgba(30,58,138,0.25)';
          ctx.lineWidth = 0.8 / k;
          ctx.stroke();
        } else if (n.type === 'corpus' || n.type === 'kb') {
          var hubColor = HUB_COLORS[n.type] || '#6b7280';
          ctx.fillStyle = n._highlighted ? '#f97316' : (n._dimmed ? '#d1d5db' : hubColor);
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.15)';
          ctx.lineWidth = 1 / k;
          ctx.stroke();
        } else if (n.type === 'entity') {
          ctx.fillStyle = n._highlighted ? '#f97316' : (n._dimmed ? '#e8dde1' : '#a05c72');
          ctx.fill();
          ctx.strokeStyle = 'rgba(160,92,114,0.35)';
          ctx.lineWidth = 0.8 / k;
          ctx.stroke();
        } else {
          ctx.fillStyle = n._highlighted ? '#f97316' : (n._dimmed ? '#e2e8f0' : entryColor(n));
          ctx.fill();
        }
      }

      // ── 레이블 ───────────────────────────────────────────────────────────────
      // hub 노드(category/formation/kb): 항상 표시 + 더 크게
      // element 허브: degree >= HUB_LABEL_DEGREE 일 때 항상 표시
      // 줌 >= ZOOM_LABEL_THRESHOLD: 모든 노드 표시
      var showAllLabels = k >= ZOOM_LABEL_THRESHOLD;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (var m = 0; m < nodes.length; m++) {
        var nd = nodes[m];
        if (nd.x == null || nd.y == null) continue;

        var isHub = nd.type === 'corpus' || nd.type === 'kb';
        var showLabel = false;
        if (isHub) {
          showLabel = true;  // 허브 노드 라벨 상시 표시
        } else if (nd.type === 'element') {
          showLabel = showAllLabels || (nd.degree >= HUB_LABEL_DEGREE);
        } else if (nd.type === 'entity') {
          showLabel = showAllLabels || (nd.degree >= 4) || nd._highlighted;
        } else {
          showLabel = showAllLabels || nd._highlighted;
        }
        if (!showLabel) continue;

        var rr = nodeRadius(nd);
        var fs;
        if (isHub) {
          fs = 13 / k;
        } else if (nd.type === 'element' || nd.type === 'entity') {
          fs = Math.max(8, Math.min(14, rr * 1.4)) / k;
        } else {
          fs = 9 / k;
        }
        var weight = (isHub || nd.type === 'element' || nd.type === 'entity') ? '600 ' : '400 ';
        ctx.font = weight + fs + 'px Noto Sans KR, Pretendard, sans-serif';

        var lx = nd.x, ly = nd.y - rr - 3 / k;
        if (isHub) {
          ctx.fillStyle = HUB_COLORS[nd.type] || '#334155';
        } else {
          ctx.fillStyle = nd.type === 'element' ? '#1e3a8a'
                        : nd.type === 'entity' ? '#7c3f52' : '#334155';
        }
        ctx.globalAlpha = 0.92;
        ctx.fillText(nd.label, lx, ly);
        ctx.globalAlpha = 1;
      }

      ctx.restore();
    }

    // ── 툴팁 ─────────────────────────────────────────────────────────────────
    var tooltip = document.getElementById('tooltip');
    var ttLabel = document.getElementById('tt-label');
    var ttMeta  = document.getElementById('tt-meta');

    function screenToGraph(ex, ey) {
      return [(ex - transform.x) / transform.k, (ey - transform.y) / transform.k];
    }

    function findNode(gx, gy) {
      var best = null, bestDist = Infinity;
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        if (n.x == null || n.y == null) continue;
        var dx = n.x - gx, dy = n.y - gy;
        var r = nodeRadius(n);
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist <= r + 6 / transform.k && dist < bestDist) {
          best = n; bestDist = dist;
        }
      }
      return best;
    }

    canvas.addEventListener('mousemove', function(e) {
      var rect = canvas.getBoundingClientRect();
      var ex = e.clientX - rect.left, ey = e.clientY - rect.top;
      var gp = screenToGraph(ex, ey);
      var n = findNode(gp[0], gp[1]);

      if (n) {
        ttLabel.textContent = n.label;
        if (n.type === 'element') {
          ttMeta.textContent = '구성 요소 · 연결 표제어 ' + n.degree + '개';
        } else if (n.type === 'corpus') {
          ttMeta.textContent = '말뭉치';
        } else if (n.type === 'kb') {
          ttMeta.textContent = '지식베이스';
        } else if (n.type === 'entity') {
          ttMeta.textContent = '개체명 (' + (n.cls || '') + ') · 기사 ' + n.degree + '건';
        } else {
          var meta = '';
          if (n.year) meta += n.year + '년';
          if (n.cat) meta += (meta ? ' · ' : '') + n.cat;
          ttMeta.textContent = meta || '표제어';
        }
        tooltip.style.display = 'block';
        var tx = ex + 14, ty = ey - 10;
        if (tx + 230 > W) tx = ex - 240;
        if (ty + 60 > H) ty = ey - 70;
        tooltip.style.left = tx + 'px';
        tooltip.style.top  = ty + 'px';
        canvas.style.cursor = 'pointer';
      } else {
        tooltip.style.display = 'none';
        canvas.style.cursor = '';
      }
    });

    canvas.addEventListener('mouseleave', function() {
      tooltip.style.display = 'none';
    });

    // ── 클릭: entry→페이지 이동, 허브 노드→이웃 강조 ─────────────────────
    var _lastClickTime = 0;
    canvas.addEventListener('click', function(e) {
      // zoom 드래그와 구별 (click threshold 5ms)
      var now = Date.now();
      if (now - _lastClickTime < 300) return;
      _lastClickTime = now;

      var rect = canvas.getBoundingClientRect();
      var ex = e.clientX - rect.left, ey = e.clientY - rect.top;
      var gp = screenToGraph(ex, ey);
      var n = findNode(gp[0], gp[1]);

      if (!n) {
        // 배경 클릭: 강조 해제
        nodes.forEach(function(nd) { nd._highlighted = false; nd._dimmed = false; });
        draw(); return;
      }

      if (n.type === 'entry') {
        window.location.href = 'id/' + n.id + '.html';
      } else {
        // 허브 노드(element/category/formation/kb) 클릭: 연결 entry 강조
        var neighbors = new Set();
        links.forEach(function(l) {
          if (l.source === n || l.target === n) {
            if (l.source.type === 'entry') neighbors.add(l.source.id);
            if (l.target.type === 'entry') neighbors.add(l.target.id);
          }
        });
        nodes.forEach(function(nd) {
          if (nd.type === 'entry') {
            nd._highlighted = neighbors.has(nd.id);
            nd._dimmed = !neighbors.has(nd.id);
          } else {
            nd._highlighted = false; nd._dimmed = (nd !== n);
          }
        });
        draw();
      }
    });

    // ── 검색: 표제어 노드 줌 + 강조 ──────────────────────────────────────────
    var searchInput = document.getElementById('graphSearch');
    var _searchTimer = null;
    searchInput.addEventListener('input', function() {
      clearTimeout(_searchTimer);
      var q = this.value.trim();
      _searchTimer = setTimeout(function() {
        doSearch(q);
      }, 250);
    });

    function doSearch(q) {
      if (!q) {
        nodes.forEach(function(n) { n._highlighted = false; n._dimmed = false; });
        draw(); return;
      }
      var ql = q.toLowerCase();
      var found = null;
      nodes.forEach(function(n) {
        var match = n.label && n.label.toLowerCase().indexOf(ql) !== -1;
        n._highlighted = match && n.type === 'entry';
        n._dimmed = !match;
        if (match && n.type === 'entry' && !found) found = n;
      });
      draw();
      if (found && found.x != null && found.y != null) {
        var targetZoom = Math.max(transform.k, 3);
        var tx = W / 2 - found.x * targetZoom;
        var ty = H / 2 - found.y * targetZoom;
        d3.select(canvas).transition().duration(600)
          .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(targetZoom));
      }
    }

    // ── 초기 resize ───────────────────────────────────────────────────────────
    resize();
  })();
  </script>

</body>
</html>
