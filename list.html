    var tbody = document.getElementById('indexBody');
    var countEl = document.getElementById('indexCount');
    var searchEl = document.getElementById('indexSearch');
    var banner = document.getElementById('isolatedBanner');

    // ?filter=고립 쿼리 감지
    var urlParams = new URLSearchParams(window.location.search);
    var filterIsolated = urlParams.get('filter') === '고립';
    if (filterIsolated && banner) {
      banner.style.display = 'block';
      var isoRows = ROWS.filter(function(r) { return r.iso; });
      banner.innerHTML = '구성 성분 미공유 신어 ' + isoRows.length + '개 &mdash; '
        + '<a href="list.html" style="color:var(--accent-nova);">전체 목록 보기</a>';
    }

    // HTML 이스케이프 헬퍼 (Stream A Fix #3 — innerHTML XSS 방어)
    function escH(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderRows(data) {
      var html = '';
      for (var i = 0; i < data.length; i++) {
        var r = data[i];
        html += '<tr>'
          + '<td><a class="index-hw-link" href="id/' + escH(r.id) + '.html">' + escH(r.hw) + '</a></td>'
          + '<td>' + escH(r.year || '') + '</td>'
          + '<td>' + escH(r.pos || '') + '</td>'
          + '<td>' + (r.cat ? '<span class="index-cat-badge">' + escH(r.cat) + '</span>' : '') + '</td>'
          + '</tr>';
      }
      tbody.innerHTML = html;
      countEl.textContent = data.length + '개';
    }

    // 초기 렌더: 고립 필터 또는 전체
    var initialRows = filterIsolated ? ROWS.filter(function(r) { return r.iso; }) : ROWS;
    renderRows(initialRows);

    searchEl.addEventListener('input', function() {
      var q = this.value.trim().toLowerCase();
      var base = filterIsolated ? ROWS.filter(function(r) { return r.iso; }) : ROWS;
      if (!q) { renderRows(base); return; }
      var filtered = base.filter(function(r) {
        return (r.s || r.hw).toLowerCase().indexOf(q) !== -1
            || r.cat.toLowerCase().indexOf(q) !== -1;
      });
      renderRows(filtered);
    });
  })();
